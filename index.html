<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1a2b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="NJC Bible App is an offline-first Tamil and English Bible reader for BSI OV and KJV."
    />
    <meta name="application-name" content="NJC Bible App" />
    <title>NJC Bible App</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(ellipse at top, #1d3b5a 0%, #0b1a2b 45%, #050b14 100%);
        color: #e8d5a3;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        font-family: Georgia, "Times New Roman", serif;
        z-index: 9999;
        transition: opacity 280ms ease;
      }
      #boot-splash[data-hide="true"] {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .mark {
        width: 64px;
        height: 64px;
        border-radius: 999px;
        border: 1px solid rgba(198, 163, 90, 0.45);
        display: grid;
        place-items: center;
        margin: 0 auto 1.25rem;
        box-shadow: 0 0 36px rgba(198, 163, 90, 0.25);
      }
      #boot-splash .brand {
        letter-spacing: 0.35em;
        font-size: 0.7rem;
        text-transform: uppercase;
        color: #c6a35a;
        font-family: system-ui, sans-serif;
      }
      #boot-splash h1 {
        margin: 0.75rem 0 0;
        font-size: 2.4rem;
        font-weight: 600;
        color: #e8d5a3;
      }
      #boot-splash .credit {
        margin-top: 3rem;
        letter-spacing: 0.35em;
        font-size: 0.68rem;
        text-transform: uppercase;
        color: rgba(198, 163, 90, 0.8);
        font-family: system-ui, sans-serif;
      }
    </style>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("njc-theme") || "system";
          var dark =
            theme === "dark" ||
            (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div>
        <div class="mark">
          <svg width="28" height="28" viewBox="0 0 34 34" fill="none" aria-hidden="true">
            <path d="M17 4v26M8 12h18" stroke="#c6a35a" stroke-width="2.4" stroke-linecap="round" />
            <circle cx="17" cy="17" r="15" stroke="#e8d5a3" stroke-opacity="0.35" stroke-width="1" />
          </svg>
        </div>
        <p class="brand">NJC Bible App</p>
        <h1>The Word</h1>
        <p class="credit">by JayathaSoft</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var splash = document.getElementById("boot-splash");
        if (!splash) return;
        var hide = function () {
          splash.setAttribute("data-hide", "true");
          window.setTimeout(function () {
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
          }, 320);
        };
        if (document.getElementById("root")?.childElementCount) hide();
        else {
          var observer = new MutationObserver(function () {
            if (document.getElementById("root")?.childElementCount) {
              observer.disconnect();
              hide();
            }
          });
          observer.observe(document.getElementById("root"), { childList: true });
        }
      })();
    </script>
  </body>
</html>
